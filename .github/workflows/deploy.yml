name: Build & deploy novel site (Cloudflare Pages)

# 小说站是静态站，内容更新靠人工编辑章节后 push，无需每日 cron。
# 生产部署禁用草稿；译文独立审校。草稿仅用本机 PREVIEW_DRAFTS=1 预览。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novel-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # 纯标准库、零 pip 依赖，不启用 cache: pip

      - name: Test language routes and review gate
        run: python3 -m unittest discover -s src -p 'test_*.py' -v

      # 生成生产站点，禁止通过 repo variable 绕过人工审核。
      - name: Build static site
        run: python3 src/generate.py
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://novel-9wi.pages.dev' }}
          PREVIEW_DRAFTS: '0'
          SITE_OUTPUT_DIR: site
          SITE_AUTHOR: ${{ vars.SITE_AUTHOR || 'apprank studio' }}
          SITE_CONTACT: ${{ vars.SITE_CONTACT || '' }}

      - name: Sanity check
        run: |
          test -f site/sitemap.xml || { echo "no sitemap"; exit 1; }
          test -f site/index.html || { echo "no home"; exit 1; }
          echo "URLs: $(grep -c '<loc>' site/sitemap.xml)"
          if grep -rl 'example.com' site --include=*.html | grep -q .; then
            echo "ERROR: placeholder domain found"; exit 1
          fi
          pages=$(find site -name index.html | wc -l)
          disclosed=$(grep -rl 'data-ai-disclosure="true"' site --include=*.html | wc -l)
          echo "pages: $pages, with disclosure: $disclosed"
          test "$pages" -eq "$disclosed" || { echo "ERROR: not every page has AI disclosure"; exit 1; }

      # 注入搜索引擎验证文件（可选）
      - name: Inject search-console verification files (optional)
        run: |
          python3 - <<'PY'
          import os, pathlib
          for tag in ("GSC", "BING"):
              name = os.environ.get(f"{tag}_VERIFY_FILE", "").strip()
              content = os.environ.get(f"{tag}_VERIFY_CONTENT", "").strip()
              if name and content and "/" not in name and "\\" not in name and ".." not in name:
                  (pathlib.Path("site") / name).write_text(content, encoding="utf-8")
                  print(f"[i] {tag} verification file written: {name}")
              else:
                  print(f"[i] {tag} verification not configured, skip")
          PY
        env:
          GSC_VERIFY_FILE: ${{ secrets.GSC_VERIFY_FILE }}
          GSC_VERIFY_CONTENT: ${{ secrets.GSC_VERIFY_CONTENT }}
          BING_VERIFY_FILE: ${{ secrets.BING_VERIFY_FILE }}
          BING_VERIFY_CONTENT: ${{ secrets.BING_VERIFY_CONTENT }}

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PAGES_PROJECT || 'novel' }} --production-branch=main

      - name: Write IndexNow key file
        run: |
          key="${{ secrets.INDEXNOW_KEY }}"
          if [ -z "$key" ]; then echo "[i] INDEXNOW_KEY not set, skip key file"; exit 0; fi
          printf '%s' "$key" > "site/${key}.txt"
          echo "[i] wrote site/${key}.txt"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT || 'novel' }} --branch=main

      # 部署后把 sitemap 里的 URL 提交给 IndexNow（Bing / Yandex / Seznam / Naver 共用）。
      # 失败不影响部署，输出保留在日志里便于排查。
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from urllib.parse import urlparse

          key = os.environ.get("INDEXNOW_KEY", "").strip()
          if not key:
              print("[i] INDEXNOW_KEY not set, skip IndexNow")
              sys.exit(0)

          xml = open("site/sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>(.*?)</loc>", xml)[:10000]
          if not urls:
              print("[i] no URLs in sitemap, skip")
              sys.exit(0)

          host = urlparse(urls[0]).netloc
          payload = {"host": host, "key": key,
                     "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
                                       data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8",
                                                "User-Agent": "apprank-studio/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"[i] IndexNow {r.status} for {len(urls)} URLs on {host}")
          except urllib.error.HTTPError as e:
              print(f"[!] IndexNow HTTP {e.code}: {e.read()[:200]}")
          sys.exit(0)
          PY
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
